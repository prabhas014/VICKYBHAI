<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Legend of Vicky</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Content -->
    <!-- Instruction Banner -->
    <div id="click-banner" style="position: fixed; top: 0; left: 0; width: 100%; background: red; color: yellow; text-align: center; padding: 10px; font-size: 20px; z-index: 10000; cursor: pointer; border-bottom: 3px dashed yellow; animation: blinker 1s infinite;">
        🚨 CLICK ANYWHERE TO BLAST THE MUSIC! 🚨
    </div>
    <div id="main-content">
        <h1 class="rainbow-text blink">🌟 KALA JAMUN 🌟</h1>
        
        <div class="gallery">
            <div class="card spin-slow">
                <img src="images/media__1779444631423.jpg" alt="Vicky 1" class="funny-img">
                <h2>ERRIPUK VICKY</h2>
            </div>
            
            <div class="card bounce">
                <img src="images/media__1779444631445.jpg" alt="Vicky 2" class="funny-img">
                <h2>DAGGAD VICKY</h2>
            </div>

            <div class="card shake">
                <img src="images/media__1779446178091.jpg" alt="BGIS Player" class="funny-img">
                <h2>BGIS PLAYER</h2>
            </div>

            <div class="card spin-fast">
                <img src="images/media__1779444631489.jpg" alt="Vicky 4" class="funny-img">
                <h2>ROTATION VICKY</h2>
            </div>
        </div>

        <!-- Funny Dog GIFs -->
        <img src="https://media.giphy.com/media/3o7527pa7qs9kCG78A/giphy.gif" class="dog-gif top-left">
        <img src="https://media.giphy.com/media/mCRJDo24UvJMA/giphy.gif" class="dog-gif bottom-right">
        <img src="https://media.giphy.com/media/5wWf7GMbT1ZUGcb5HVu/giphy.gif" class="dog-gif center-right">
        <img src="https://media.giphy.com/media/bbshzgyFQDqPHXBo4c/giphy.gif" class="dog-gif bottom-left">
    </div>

    <!-- YouTube Audio Player Container -->
    <div id="player" style="position: absolute; top: -9999px; left: -9999px;"></div>

    <script src="script.js"></script>
</body>
</html>
